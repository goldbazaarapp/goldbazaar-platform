<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Onboarding — GoldBazaar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.0/Recharts.js"></script>

  <!-- Lucide React Icons (inline SVGs) -->
  <script type="text/babel">
    const LucideIcons = {
      ChevronRight: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      ),
      ChevronLeft: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      ),
      CheckCircle: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      ),
      AlertCircle: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      ),
      Users: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      ),
      TrendingUp: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 17"></polyline>
          <polyline points="17 6 23 6 23 12"></polyline>
        </svg>
      ),
      Target: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="12" cy="12" r="5"></circle>
          <circle cx="12" cy="12" r="9"></circle>
        </svg>
      ),
      Lock: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      ),
      Upload: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
      ),
      MapPin: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      ),
      Eye: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      ),
      Heart: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
      ),
      BarChart3: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <line x1="12" y1="20" x2="12" y2="10"></line>
          <line x1="18" y1="20" x2="18" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="16"></line>
        </svg>
      ),
      PieChart: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 12v-10"></path>
          <path d="M12 12h10"></path>
        </svg>
      ),
      Zap: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      ),
      Award: (props) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
          <circle cx="12" cy="8" r="7"></circle>
          <polyline points="8 14 12 17 16 14"></polyline>
          <line x1="12" y1="17" x2="12" y2="22"></line>
          <line x1="9" y1="22" x2="15" y2="22"></line>
        </svg>
      ),
    };

    const { useState } = React;

    const VendorOnboardingPortal = () => {
      const [currentStep, setCurrentStep] = useState(0);
      const [errors, setErrors] = useState({});
      const [formData, setFormData] = useState({
        mobile: '',
        otp: '',
        businessName: '',
        ownerName: '',
        gstNumber: '',
        businessCategory: '',
        yearsInBusiness: '',
        address: '',
        city: '',
        state: '',
        pincode: '',
        services: [],
        schemeName: '',
        schemeDescription: '',
        benefits: '',
        validity: '',
      });

      const steps = [
        'Mobile Verification',
        'Business Info',
        'Address',
        'Services',
        'Branding',
        'Scheme Setup',
        'Review & Submit',
      ];

      const serviceOptions = [
        { id: 'gold-loan', label: 'Gold Loan' },
        { id: 'gold-sell', label: 'Gold Sell' },
        { id: 'gold-exchange', label: 'Gold Exchange' },
        { id: 'jewellery', label: 'Jewellery Purchase' },
        { id: 'savings', label: 'Gold Savings Scheme' },
      ];

      const validateStep = (stepIndex) => {
        const newErrors = {};

        if (stepIndex === 0) {
          if (!formData.mobile.trim()) {
            newErrors.mobile = 'Mobile number is required';
          } else if (!/^[6-9]\d{9}$/.test(formData.mobile.replace(/\D/g, ''))) {
            newErrors.mobile = 'Enter a valid 10-digit mobile number';
          }
          if (!formData.otp.trim()) {
            newErrors.otp = 'OTP is required';
          } else if (!/^\d{6}$/.test(formData.otp)) {
            newErrors.otp = 'OTP must be 6 digits';
          }
        } else if (stepIndex === 1) {
          if (!formData.businessName.trim()) {
            newErrors.businessName = 'Business name is required';
          } else if (formData.businessName.length < 3) {
            newErrors.businessName = 'Business name must be at least 3 characters';
          }
          if (!formData.ownerName.trim()) {
            newErrors.ownerName = 'Owner name is required';
          } else if (formData.ownerName.length < 3) {
            newErrors.ownerName = 'Owner name must be at least 3 characters';
          }
          if (!formData.gstNumber.trim()) {
            newErrors.gstNumber = 'GST number is required';
          } else if (!/^\d{2}[A-Z]{5}\d{4}[A-Z]{1}[A-Z\d]{1}[Z]{1}[A-Z\d]{1}$/.test(formData.gstNumber)) {
            newErrors.gstNumber = 'Enter a valid 15-character GST number';
          }
          if (!formData.businessCategory) {
            newErrors.businessCategory = 'Please select a business category';
          }
          if (!formData.yearsInBusiness) {
            newErrors.yearsInBusiness = 'Years in business is required';
          } else if (isNaN(formData.yearsInBusiness) || formData.yearsInBusiness < 0 || formData.yearsInBusiness > 70) {
            newErrors.yearsInBusiness = 'Enter a valid number between 0 and 70';
          }
        } else if (stepIndex === 2) {
          if (!formData.address.trim()) {
            newErrors.address = 'Address is required';
          } else if (formData.address.length < 5) {
            newErrors.address = 'Address must be at least 5 characters';
          }
          if (!formData.city.trim()) {
            newErrors.city = 'City is required';
          } else if (formData.city.length < 2) {
            newErrors.city = 'Enter a valid city name';
          }
          if (!formData.state.trim()) {
            newErrors.state = 'State is required';
          }
          if (!formData.pincode.trim()) {
            newErrors.pincode = 'Pincode is required';
          } else if (!/^\d{6}$/.test(formData.pincode)) {
            newErrors.pincode = 'Pincode must be exactly 6 digits';
          }
        } else if (stepIndex === 3) {
          if (formData.services.length === 0) {
            newErrors.services = 'Select at least one service';
          }
        } else if (stepIndex === 5) {
          if (!formData.schemeName.trim()) {
            newErrors.schemeName = 'Scheme name is required';
          } else if (formData.schemeName.length < 3) {
            newErrors.schemeName = 'Scheme name must be at least 3 characters';
          }
          if (!formData.schemeDescription.trim()) {
            newErrors.schemeDescription = 'Scheme description is required';
          } else if (formData.schemeDescription.length < 10) {
            newErrors.schemeDescription = 'Description must be at least 10 characters';
          }
          if (!formData.benefits.trim()) {
            newErrors.benefits = 'Key benefits are required';
          } else if (formData.benefits.length < 5) {
            newErrors.benefits = 'Benefits must be at least 5 characters';
          }
          if (!formData.validity) {
            newErrors.validity = 'Validity period is required';
          } else if (isNaN(formData.validity) || formData.validity < 1 || formData.validity > 60) {
            newErrors.validity = 'Validity must be between 1 and 60 months';
          }
        }

        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
        if (errors[name]) {
          setErrors((prev) => ({ ...prev, [name]: '' }));
        }
      };

      const handleServiceToggle = (serviceId) => {
        setFormData((prev) => ({
          ...prev,
          services: prev.services.includes(serviceId)
            ? prev.services.filter((id) => id !== serviceId)
            : [...prev.services, serviceId],
        }));
        if (errors.services) {
          setErrors((prev) => ({ ...prev, services: '' }));
        }
      };

      const handleNextStep = () => {
        if (validateStep(currentStep)) {
          if (currentStep < steps.length - 1) {
            setCurrentStep(currentStep + 1);
            window.scrollTo(0, 0);
          }
        }
      };

      const handlePrevStep = () => {
        if (currentStep > 0) {
          setCurrentStep(currentStep - 1);
          window.scrollTo(0, 0);
        }
      };

      const handleSubmit = () => {
        if (validateStep(currentStep)) {
          alert('✓ Vendor registration submitted for verification!\n\nWe will verify your details and contact you within 24 hours.');
          setFormData({
            mobile: '',
            otp: '',
            businessName: '',
            ownerName: '',
            gstNumber: '',
            businessCategory: '',
            yearsInBusiness: '',
            address: '',
            city: '',
            state: '',
            pincode: '',
            services: [],
            schemeName: '',
            schemeDescription: '',
            benefits: '',
            validity: '',
          });
          setCurrentStep(0);
        }
      };

      const renderStep = () => {
        switch (currentStep) {
          case 0:
            return (
              <div className="space-y-6">
                <div>
                  <label className="block text-sm font-semibold text-gray-200 mb-2">Mobile Number</label>
                  <input
                    type="tel"
                    name="mobile"
                    value={formData.mobile}
                    onChange={handleInputChange}
                    placeholder="+91 98765 43210"
                    className={`w-full px-4 py-3 bg-gray-800 border ${errors.mobile ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                  />
                  {errors.mobile && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.mobile}</div>}
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-200 mb-2">OTP</label>
                  <input
                    type="text"
                    name="otp"
                    value={formData.otp}
                    onChange={handleInputChange}
                    placeholder="Enter 6-digit OTP"
                    maxLength="6"
                    className={`w-full px-4 py-3 bg-gray-800 border ${errors.otp ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                  />
                  {errors.otp && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.otp}</div>}
                </div>
              </div>
            );
          case 1:
            return (
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-semibold text-gray-200 mb-2">Business Name</label>
                  <input
                    type="text"
                    name="businessName"
                    value={formData.businessName}
                    onChange={handleInputChange}
                    placeholder="Your Business Name"
                    className={`w-full px-4 py-3 bg-gray-800 border ${errors.businessName ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                  />
                  {errors.businessName && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.businessName}</div>}
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-200 mb-2">Owner Name</label>
                  <input
                    type="text"
                    name="ownerName"
                    value={formData.ownerName}
                    onChange={handleInputChange}
                    placeholder="Full Name"
                    className={`w-full px-4 py-3 bg-gray-800 border ${errors.ownerName ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                  />
                  {errors.ownerName && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.ownerName}</div>}
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-200 mb-2">GST Number</label>
                  <input
                    type="text"
                    name="gstNumber"
                    value={formData.gstNumber}
                    onChange={handleInputChange}
                    placeholder="15 Character GST Number"
                    className={`w-full px-4 py-3 bg-gray-800 border ${errors.gstNumber ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                  />
                  {errors.gstNumber && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.gstNumber}</div>}
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-semibold text-gray-200 mb-2">Category *</label>
                    <select
                      name="businessCategory"
                      value={formData.businessCategory}
                      onChange={handleInputChange}
                      className={`w-full px-4 py-3 bg-gray-800 border ${errors.businessCategory ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                    >
                      <option value="">Select Category</option>
                      <option value="gold-dealer">Gold Dealer</option>
                      <option value="jeweler">Jeweler</option>
                      <option value="pawn">Pawn Shop</option>
                    </select>
                    {errors.businessCategory && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.businessCategory}</div>}
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-200 mb-2">Years in Business</label>
                    <input
                      type="number"
                      name="yearsInBusiness"
                      value={formData.yearsInBusiness}
                      onChange={handleInputChange}
                      placeholder="5"
                      min="0"
                      max="70"
                      className={`w-full px-4 py-3 bg-gray-800 border ${errors.yearsInBusiness ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                    />
                    {errors.yearsInBusiness && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.yearsInBusiness}</div>}
                  </div>
                </div>
              </div>
            );
          case 2:
            return (
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-semibold text-gray-200 mb-2">Address</label>
                  <input
                    type="text"
                    name="address"
                    value={formData.address}
                    onChange={handleInputChange}
                    placeholder="Street Address"
                    className={`w-full px-4 py-3 bg-gray-800 border ${errors.address ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                  />
                  {errors.address && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.address}</div>}
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-semibold text-gray-200 mb-2">City</label>
                    <input
                      type="text"
                      name="city"
                      value={formData.city}
                      onChange={handleInputChange}
                      placeholder="Bangalore"
                      className={`w-full px-4 py-3 bg-gray-800 border ${errors.city ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                    />
                    {errors.city && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.city}</div>}
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-200 mb-2">State</label>
                    <input
                      type="text"
                      name="state"
                      value={formData.state}
                      onChange={handleInputChange}
                      placeholder="Karnataka"
                      className={`w-full px-4 py-3 bg-gray-800 border ${errors.state ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                    />
                    {errors.state && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.state}</div>}
                  </div>
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-200 mb-2">Pincode</label>
                  <input
                    type="text"
                    name="pincode"
                    value={formData.pincode}
                    onChange={handleInputChange}
                    placeholder="560001"
                    maxLength="6"
                    className={`w-full px-4 py-3 bg-gray-800 border ${errors.pincode ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                  />
                  {errors.pincode && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.pincode}</div>}
                </div>
              </div>
            );
          case 3:
            return (
              <div className="space-y-4">
                <p className="text-sm text-gray-400">Select at least one service you offer:</p>
                <div className="space-y-3">
                  {serviceOptions.map((service) => (
                    <label key={service.id} className="flex items-center p-4 bg-gray-800 border border-gray-700 rounded-lg cursor-pointer hover:border-yellow-500 transition">
                      <input
                        type="checkbox"
                        checked={formData.services.includes(service.id)}
                        onChange={() => handleServiceToggle(service.id)}
                        className="w-4 h-4 rounded accent-yellow-500"
                      />
                      <span className="ml-3 text-white font-medium">{service.label}</span>
                    </label>
                  ))}
                </div>
                {errors.services && <div className="flex items-center gap-2 text-red-400 text-sm bg-red-900/20 p-3 rounded"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.services}</div>}
              </div>
            );
          case 4:
            return (
              <div className="space-y-4">
                {['Logo', 'Store Images', 'Banner Images', 'Promotional Images'].map((item) => (
                  <div key={item} className="border-2 border-dashed border-gray-700 rounded-lg p-6 text-center cursor-pointer hover:border-yellow-500 transition">
                    <LucideIcons.Upload className="w-8 h-8 text-yellow-500 mx-auto mb-2" />
                    <p className="text-sm font-medium text-white">{item}</p>
                    <p className="text-xs text-gray-400">Click to upload or drag & drop</p>
                  </div>
                ))}
              </div>
            );
          case 5:
            return (
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-semibold text-gray-200 mb-2">Scheme Name</label>
                  <input
                    type="text"
                    name="schemeName"
                    value={formData.schemeName}
                    onChange={handleInputChange}
                    placeholder="e.g., Gold Savings Plus"
                    className={`w-full px-4 py-3 bg-gray-800 border ${errors.schemeName ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                  />
                  {errors.schemeName && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.schemeName}</div>}
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-200 mb-2">Description</label>
                  <textarea
                    name="schemeDescription"
                    value={formData.schemeDescription}
                    onChange={handleInputChange}
                    placeholder="Describe your scheme in detail..."
                    rows="3"
                    className={`w-full px-4 py-3 bg-gray-800 border ${errors.schemeDescription ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                  />
                  {errors.schemeDescription && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.schemeDescription}</div>}
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-200 mb-2">Key Benefits</label>
                  <input
                    type="text"
                    name="benefits"
                    value={formData.benefits}
                    onChange={handleInputChange}
                    placeholder="e.g., Low interest, Fast approval"
                    className={`w-full px-4 py-3 bg-gray-800 border ${errors.benefits ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                  />
                  {errors.benefits && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.benefits}</div>}
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-200 mb-2">Validity (in months)</label>
                  <input
                    type="number"
                    name="validity"
                    value={formData.validity}
                    onChange={handleInputChange}
                    placeholder="12"
                    min="1"
                    max="60"
                    className={`w-full px-4 py-3 bg-gray-800 border ${errors.validity ? 'border-red-500' : 'border-gray-700'} text-white rounded-lg focus:outline-none transition`}
                  />
                  {errors.validity && <div className="flex items-center gap-2 mt-2 text-red-400 text-sm"><LucideIcons.AlertCircle className="w-4 h-4" /> {errors.validity}</div>}
                </div>
              </div>
            );
          case 6:
            return (
              <div className="space-y-4">
                <div className="bg-green-900/20 border border-green-800 rounded-lg p-4 mb-4">
                  <div className="flex items-center">
                    <LucideIcons.CheckCircle className="w-5 h-5 text-green-400 mr-2" />
                    <p className="text-green-400 text-sm font-medium">All information validated and ready!</p>
                  </div>
                </div>
                <div className="bg-gray-800 rounded-lg p-4 space-y-3">
                  <div className="flex justify-between items-center border-b border-gray-700 pb-3">
                    <span className="text-gray-400">Mobile</span>
                    <span className="text-white font-medium">{formData.mobile}</span>
                  </div>
                  <div className="flex justify-between items-center border-b border-gray-700 pb-3">
                    <span className="text-gray-400">Business</span>
                    <span className="text-white font-medium">{formData.businessName}</span>
                  </div>
                  <div className="flex justify-between items-center border-b border-gray-700 pb-3">
                    <span className="text-gray-400">Owner</span>
                    <span className="text-white font-medium">{formData.ownerName}</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-gray-400">Services</span>
                    <span className="text-white font-medium">{formData.services.length} selected</span>
                  </div>
                </div>
              </div>
            );
          default:
            return null;
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-black">
          <div className="border-b border-gray-800 bg-gray-900/50 backdrop-blur">
            <div className="max-w-7xl mx-auto px-6 py-6">
              <div className="text-center">
                <h1 className="text-3xl md:text-4xl font-bold text-white mb-2">Vendor Self-Care Onboarding</h1>
                <p className="text-gray-400">Join India's Trusted Gold Services Marketplace</p>
              </div>
            </div>
          </div>

          <div className="max-w-4xl mx-auto px-6 py-8">
            <div className="bg-gray-800/50 backdrop-blur border border-gray-700 rounded-xl p-8">
              <div className="mb-8">
                <div className="flex items-center justify-between mb-4">
                  {steps.map((step, index) => (
                    <div key={index} className={`flex items-center ${index < steps.length - 1 ? 'flex-1' : ''}`}>
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition ${index <= currentStep ? 'bg-yellow-500 text-black' : 'bg-gray-700 text-gray-400'}`}>
                        {index + 1}
                      </div>
                      {index < steps.length - 1 && <div className={`flex-1 h-1 mx-2 transition ${index < currentStep ? 'bg-yellow-500' : 'bg-gray-700'}`} />}
                    </div>
                  ))}
                </div>
                <p className="text-center text-yellow-500 font-semibold text-sm">Step {currentStep + 1} of {steps.length}: {steps[currentStep]}</p>
              </div>

              <div className="min-h-96 mb-8">{renderStep()}</div>

              <div className="flex gap-3">
                <button
                  onClick={handlePrevStep}
                  disabled={currentStep === 0}
                  className={`flex-1 py-3 px-4 rounded-lg font-semibold transition flex items-center justify-center gap-2 ${currentStep === 0 ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : 'bg-gray-700 text-white hover:bg-gray-600'}`}
                >
                  <LucideIcons.ChevronLeft className="w-4 h-4" /> Back
                </button>
                {currentStep === steps.length - 1 ? (
                  <button
                    onClick={handleSubmit}
                    className="flex-1 py-3 px-4 bg-yellow-500 text-black rounded-lg font-semibold hover:bg-yellow-400 transition flex items-center justify-center gap-2"
                  >
                    <LucideIcons.CheckCircle className="w-4 h-4" /> Submit
                  </button>
                ) : (
                  <button
                    onClick={handleNextStep}
                    className="flex-1 py-3 px-4 bg-yellow-500 text-black rounded-lg font-semibold hover:bg-yellow-400 transition flex items-center justify-center gap-2"
                  >
                    Next <LucideIcons.ChevronRight className="w-4 h-4" />
                  </button>
                )}
              </div>

              <div className="mt-6 pt-6 border-t border-gray-700 flex items-center justify-center gap-2 text-xs text-gray-400">
                <LucideIcons.Lock className="w-3 h-3" /> Bank-level encryption
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<VendorOnboardingPortal />);
  </script>
</body>
</html>
