<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login — GoldBazaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  background:#000;color:#fff;
  font-family:'Inter',-apple-system,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
:root{--g:#C9A84C;--gl:#E8C96A;--fd:'Playfair Display',Georgia,serif}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 30% 30%,rgba(201,168,76,.10) 0%,transparent 70%),
             radial-gradient(ellipse 50% 60% at 70% 70%,rgba(201,168,76,.07) 0%,transparent 70%);}
.card{position:relative;z-index:1;width:100%;max-width:420px;margin:20px;
  background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.18);border-radius:24px;
  padding:44px 40px 40px;backdrop-filter:blur(20px);
  box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);}
.login-logo{display:flex;justify-content:center;margin-bottom:28px}
.login-logo img{height:60px;width:auto}
.login-logo-fallback{font-family:var(--fd);font-size:28px;font-weight:700;
  background:linear-gradient(135deg,#C9A84C,#F5E6C0,#C9A84C);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
h1{font-family:var(--fd);font-size:26px;font-weight:700;text-align:center;letter-spacing:-.02em;margin-bottom:6px;}
.subtitle{font-size:13.5px;color:rgba(255,255,255,.5);text-align:center;line-height:1.6;margin-bottom:32px;}
.step{display:none}.step.active{display:block}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:8px;}
.input-wrap{display:flex;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.2);border-radius:12px;padding:0 16px;transition:border-color .2s;margin-bottom:20px;}
.input-wrap:focus-within{border-color:var(--g)}
.input-wrap .prefix{font-size:14px;font-weight:600;color:rgba(255,255,255,.55);border-right:1px solid rgba(255,255,255,.1);padding-right:10px;margin-right:10px;white-space:nowrap;}
.input-wrap input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:15px;font-family:inherit;padding:14px 0;}
.input-wrap input::placeholder{color:rgba(255,255,255,.25)}
.otp-row{display:flex;gap:10px;justify-content:center;margin-bottom:20px;}
.otp-box{width:48px;height:56px;border-radius:12px;border:1px solid rgba(201,168,76,.2);background:rgba(255,255,255,.05);color:#fff;font-size:22px;font-weight:700;text-align:center;outline:none;transition:border-color .2s;}
.otp-box:focus{border-color:var(--g);background:rgba(201,168,76,.08)}
.btn{width:100%;padding:15px;border-radius:50px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;border:none;transition:transform .2s,box-shadow .2s,opacity .2s;}
.btn-primary{background:linear-gradient(135deg,var(--g),var(--gl));color:#000;}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 32px rgba(201,168,76,.38)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:none;color:rgba(255,255,255,.5);font-size:13px;font-weight:500;margin-top:14px;width:100%;text-align:center;padding:8px;cursor:pointer;border:none;font-family:inherit;}
.btn-ghost:hover{color:var(--g)}
.msg{font-size:13px;text-align:center;padding:10px 14px;border-radius:10px;margin-bottom:16px;display:none;}
.msg.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#f87171;display:block}
.msg.success{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);color:#4ade80;display:block}
.timer{font-size:13px;color:rgba(255,255,255,.4);text-align:center;margin-top:10px}
.timer span{color:var(--g);font-weight:600}
.phone-display{font-size:15px;font-weight:600;color:var(--g);text-align:center;margin-bottom:24px;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
.success-icon{font-size:52px;text-align:center;margin-bottom:16px;animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.success-name{font-family:var(--fd);font-size:22px;font-weight:700;text-align:center;margin-bottom:8px;}
.success-sub{font-size:13.5px;color:rgba(255,255,255,.5);text-align:center;margin-bottom:28px;}
@media(max-width:480px){.card{padding:36px 24px 32px}.otp-box{width:42px;height:50px;font-size:20px}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="card">

  <div class="login-logo">
    <img src="images/logo.png" alt="GoldBazaar" onerror="this.style.display='none';document.querySelector('.login-logo-fallback').style.display='block'"/>
    <span class="login-logo-fallback" style="display:none">GoldBazaar</span>
  </div>

  <!-- STEP 1: Phone -->
  <div class="step active" id="step-phone">
    <h1>Welcome Back</h1>
    <p class="subtitle">Enter your mobile number to receive a one-time password</p>
    <div id="msg-phone" class="msg"></div>
    <label for="phone-input">Mobile Number</label>
    <div class="input-wrap">
      <span class="prefix">🇮🇳 +91</span>
      <input type="tel" id="phone-input" placeholder="98765 43210" maxlength="10" inputmode="numeric" autocomplete="tel"/>
    </div>
    <button class="btn btn-primary" id="send-btn" onclick="sendOTP()">Send OTP</button>
    <button class="btn-ghost" onclick="window.location.href='index.html'">← Back to GoldBazaar</button>
  </div>

  <!-- STEP 2: OTP -->
  <div class="step" id="step-otp">
    <h1>Verify OTP</h1>
    <p class="subtitle">Enter the 6-digit code sent to</p>
    <div class="phone-display" id="phone-display"></div>
    <div id="msg-otp" class="msg"></div>
    <label>Enter OTP</label>
    <div class="otp-row" id="otp-row">
      <input class="otp-box" type="tel" maxlength="1" inputmode="numeric"/>
      <input class="otp-box" type="tel" maxlength="1" inputmode="numeric"/>
      <input class="otp-box" type="tel" maxlength="1" inputmode="numeric"/>
      <input class="otp-box" type="tel" maxlength="1" inputmode="numeric"/>
      <input class="otp-box" type="tel" maxlength="1" inputmode="numeric"/>
      <input class="otp-box" type="tel" maxlength="1" inputmode="numeric"/>
    </div>
    <button class="btn btn-primary" id="verify-btn" onclick="verifyOTP()" disabled>Verify OTP</button>
    <div class="timer" id="timer-display"></div>
    <button class="btn-ghost" id="resend-btn" onclick="resendOTP()" style="display:none">Resend OTP</button>
    <button class="btn-ghost" onclick="goBack()">← Change number</button>
  </div>

  <!-- STEP 3: Success -->
  <div class="step" id="step-success">
    <div class="success-icon">✅</div>
    <div class="success-name">You're logged in!</div>
    <div class="success-sub" id="success-sub">Welcome to GoldBazaar</div>
    <button class="btn btn-primary" onclick="window.location.href='index.html'">Explore GoldBazaar →</button>
  </div>

</div>

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
let timerInterval = null, userPhone = '';

// ── SEND OTP (uses Firebase exposed via module script below) ─────────────────
async function sendOTP() {
  const input = document.getElementById('phone-input');
  const phone = input.value.replace(/\D/g,'');
  const msgEl = document.getElementById('msg-phone');
  const btn   = document.getElementById('send-btn');
  if (phone.length !== 10) { showMsg(msgEl,'error','Please enter a valid 10-digit mobile number.'); return; }
  userPhone = phone;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Sending…';
  hideMsg(msgEl);

  const result = await window.firebaseSendOTP('+91' + phone);

  btn.disabled = false;
  btn.textContent = 'Send OTP';

  if (result.success) {
    goToStep('step-otp');
    document.getElementById('phone-display').textContent = `+91 ${phone.replace(/(\d{5})(\d{5})/, '$1 $2')}`;
    startTimer();
    setupOTPBoxes();
  } else {
    showMsg(msgEl,'error', result.message || 'Failed to send OTP. Please try again.');
  }
}

// ── OTP BOXES ────────────────────────────────────────────────────────────────
function setupOTPBoxes() {
  const boxes = document.querySelectorAll('.otp-box');
  boxes.forEach(b => b.value = '');
  boxes.forEach((box,i) => {
    box.oninput = () => {
      box.value = box.value.replace(/\D/g,'').slice(-1);
      if (box.value && i < boxes.length-1) boxes[i+1].focus();
      checkFilled();
    };
    box.onkeydown = e => { if (e.key==='Backspace' && !box.value && i>0) boxes[i-1].focus(); };
    box.onpaste = e => {
      const p = (e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');
      if (p.length >= 6) { boxes.forEach((b,j) => b.value=p[j]||''); boxes[5].focus(); checkFilled(); e.preventDefault(); }
    };
  });
  setTimeout(() => boxes[0].focus(), 300);
}
function checkFilled() {
  const filled = [...document.querySelectorAll('.otp-box')].every(b => b.value.length===1);
  document.getElementById('verify-btn').disabled = !filled;
}
function getOTP() { return [...document.querySelectorAll('.otp-box')].map(b=>b.value).join(''); }

// ── VERIFY OTP ───────────────────────────────────────────────────────────────
async function verifyOTP() {
  const entered = getOTP();
  const msgEl   = document.getElementById('msg-otp');
  const btn     = document.getElementById('verify-btn');
  hideMsg(msgEl);
  btn.disabled = true;
  btn.textContent = 'Verifying…';

  const result = await window.firebaseVerifyOTP(entered);

  if (result.success) {
    clearInterval(timerInterval);
    sessionStorage.setItem('gb_logged_in','1');
    sessionStorage.setItem('gb_phone', userPhone);
    document.getElementById('success-sub').textContent = `Logged in as +91 ${userPhone.replace(/(\d{5})(\d{5})/, '$1 $2')}`;
    goToStep('step-success');
  } else {
    showMsg(msgEl,'error', result.message || 'Incorrect OTP. Please try again.');
    document.querySelectorAll('.otp-box').forEach(b => {
      b.style.borderColor='rgba(239,68,68,.6)';
      setTimeout(()=>b.style.borderColor='',1000);
    });
    btn.disabled = false;
    btn.textContent = 'Verify OTP';
  }
}

// ── TIMER ────────────────────────────────────────────────────────────────────
function startTimer() {
  clearInterval(timerInterval);
  document.getElementById('resend-btn').style.display='none';
  const expiry = Date.now() + 5*60*1000;
  timerInterval = setInterval(() => {
    const rem = Math.max(0, Math.ceil((expiry-Date.now())/1000));
    const m = Math.floor(rem/60), s = rem%60;
    document.getElementById('timer-display').innerHTML = rem > 0
      ? `OTP expires in <span>${m}:${String(s).padStart(2,'0')}</span>` : 'OTP expired';
    if (rem === 0) { clearInterval(timerInterval); document.getElementById('resend-btn').style.display='block'; }
  }, 1000);
}

async function resendOTP() {
  document.getElementById('resend-btn').style.display='none';
  hideMsg(document.getElementById('msg-otp'));
  const result = await window.firebaseSendOTP('+91' + userPhone);
  if (result.success) {
    showMsg(document.getElementById('msg-otp'),'success','New OTP sent!');
    startTimer(); setupOTPBoxes();
  } else {
    showMsg(document.getElementById('msg-otp'),'error', result.message || 'Failed to resend.');
    document.getElementById('resend-btn').style.display='block';
  }
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function goToStep(id) { document.querySelectorAll('.step').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function goBack() { clearInterval(timerInterval); goToStep('step-phone'); }
function showMsg(el,type,text) { el.className=`msg ${type}`; el.textContent=text; }
function hideMsg(el) { el.className='msg'; el.textContent=''; }

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('phone-input').addEventListener('input', function(){ this.value=this.value.replace(/\D/g,'').slice(0,10); });
document.getElementById('phone-input').addEventListener('keydown', e => { if(e.key==='Enter') sendOTP(); });

if (sessionStorage.getItem('gb_logged_in')==='1') {
  const p = sessionStorage.getItem('gb_phone')||'';
  document.getElementById('success-sub').textContent = `Already logged in as +91 ${p.replace(/(\d{5})(\d{5})/, '$1 $2')}`;
  goToStep('step-success');
}
</script>

<div id="recaptcha-container"></div>
<script type="module" src="js/firebase-otp.js"></script>
</body>
</html>
